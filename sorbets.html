<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sorbets Production - Álainn</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

</head>
<body>
    <div id="brand">Álainn</div>

    <!-- Container for Sorbet Chart and Buttons -->
    <div class="chart-container">
        <!-- Date Title, dynamically updated in sorbets.js -->
        <h2 id="weekTitle">Sorbets Production - Week 1</h2>
        
        <!-- Chart itself -->
        <canvas id="sorbetChart"></canvas>

        <!-- Navigation Buttons for Weeks -->
        <div id="week-nav-buttons">
            <button id="previousWeekButton" class="nav-button">Previous Week</button>
            <button id="nextWeekButton" class="nav-button">Next Week</button>
        </div>

        <!-- Action Buttons below the chart -->
        <div id="button-group">
            <a href="add_production.html" class="action-button">+ Add Production</a>
            <a href="edit_target.html" class="action-button">✏️ Edit Target</a>
            <a href="index.html" class="action-button">Main Menu</a> <!-- Main Menu Button -->
            <a href="analytics.html" class="action-button">Analytics</a> <!-- New Analytics Button -->
        </div>
    </div>

    <script src="sorbets.js"></script>

</body>
</html>
